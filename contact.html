<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harrison Agents - Contact</title>
    <!-- Favicon Link -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Sidebar Navigation -->
    <aside class="sidebar">
        <img src="HAIA_profile.jpg" alt="Harrison Agents Profile" class="logo">
        <nav>
            <a href="index.html">HOME</a>
            <a href="services.html">AGENT SERVICES</a>
            <a href="solutions.html">SOLUTIONS</a>
            <a href="about.html">ABOUT US</a>
            <a href="contact.html" class="active">CONTACT</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <div class="contact-container">
            
            <div class="contact-header">
                <h1>CONNECT WITH US.</h1>
                <p>GET IN TOUCH WITH THE HARRISON AGENTS TEAM.</p>
            </div>

            <div class="contact-layout">
                
                <!-- Contact Form -->
                <form class="contact-form" action="#" method="POST">
                    <input type="text" name="name" placeholder="NAME" required>
                    <input type="email" name="email" placeholder="EMAIL" required>
                    <textarea name="message" placeholder="MESSAGE" required></textarea>
                    <button type="submit" class="btn-gold">SEND MESSAGE</button>
                </form>

                <!-- Contact Details -->
                <div class="contact-info">
                    <div class="info-block">
                        <h4>EMAIL</h4>
                        <p>info@harrisonaiagents.com</p>
                    </div>
                    <div class="info-block">
                        <h4>ADDRESS</h4>
                        <p>Maryland<br>Tech District</p>
                    </div>
                    <div class="info-block">
                        <h4>SOCIAL</h4>
                        <p><a href="https://www.linkedin.com/company/harrison-ai-agents/">Harrison AI Agents</a> (LinkedIn)</p>
                        <p>Harrison AI Agents (Twitter/X)</p>
                    </div>
                </div>

            </div>
        </div>
    </main>

</body>
</html>
